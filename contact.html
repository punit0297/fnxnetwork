<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | FNX NETWORK</title>
    <link rel="icon" type="image/png" href="FNX_LOGO.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #55FF55;
            --bg-black: #0a0a0a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(85, 255, 85, 0.2);
            --card-bg: #121212;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --glow-shadow: 0 0 20px rgba(85, 255, 85, 0.4);
            --transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-black);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-white);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .hero-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)),
                        url('https://i.ibb.co/3yyhgg4L/image.png');
            background-size: cover; background-position: center;
            z-index: -1;
        }

        nav {
            width: 100%; height: 80px;
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 8%;
        }

        .logo { height: 50px; }

        .container {
            flex: 1;
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        h1 { font-family: 'Oswald'; font-size: 3.5rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        h1 span { color: var(--primary-green); filter: drop-shadow(0 0 10px var(--primary-green)); }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .contact-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 20px;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            backdrop-filter: blur(5px);
        }

        .contact-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-green);
            box-shadow: var(--glow-shadow);
        }

        .icon-box {
            width: 70px; height: 70px;
            background: rgba(85, 255, 85, 0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.8rem;
            color: var(--primary-green);
        }

        .contact-card h3 { font-family: 'Oswald'; font-size: 1.8rem; margin-bottom: 10px; }
        .contact-card p { color: var(--text-gray); font-size: 0.9rem; margin-bottom: 15px; }
        .contact-value { color: var(--primary-green); font-weight: 900; font-size: 1.1rem; }

        .back-btn {
            display: inline-block;
            margin-top: 50px;
            padding: 12px 30px;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            text-decoration: none;
            font-family: 'Oswald';
            text-transform: uppercase;
            border-radius: 5px;
            font-weight: 700;
            transition: 0.3s;
        }

        .back-btn:hover { background: var(--primary-green); color: #000; }

        footer { text-align: center; padding: 30px; background: #000; border-top: 1px solid var(--glass-border); }
    </style>
</head>
<body>

    <div class="hero-bg"></div>

    <nav>
        <img src="FNX_LOGO.png" alt="FNX Logo" class="logo">
        <a href="index.html" class="back-btn" style="margin-top:0;">Home</a>
    </nav>

    <div class="container">
        <h1>CONTACT <span>US</span></h1>
        <p style="color: var(--text-gray);">Humein contact karne ke liye niche diye gaye options ka use karein.</p>

        <div class="contact-grid">
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=support@fnxnetwork.in" target="_blank" class="contact-card">
                <div class="icon-box"><i class="fas fa-envelope"></i></div>
                <h3>Email Us</h3>
                <p>Official support aur business inquiries ke liye.</p>
                <div class="contact-value">SUPPORT</div>
            </a>

            <a href="https://discord.gg/BNj8dTwdpm" target="_blank" class="contact-card">
                <div class="icon-box"><i class="fab fa-discord"></i></div>
                <h3>Discord</h3>
                <p>Live support tickets aur community help ke liye.</p>
                <div class="contact-value">DISCORD</div>
            </a>
        </div>

        <a href="index.html" class="back-btn">Back to Home</a>
    </div>

    <footer>
        <p style="color: #444; font-size: 0.8rem;">© 2026 FNX NETWORK | Support 24/7</p>
    </footer>

</body>

</html>
